micro_lqr_controller:
  ros__parameters:
    imu_topic: "/ecat/sn2031674/app1/read"
    rc_topic: "/ecat/sn2031674/app2/read"
    left_motor_read_topic: "/ecat/sn2031674/app3/read"
    left_motor_write_topic: "/ecat/sn2031674/app3/write"
    right_motor_read_topic: "/ecat/sn2031674/app4/read"
    right_motor_write_topic: "/ecat/sn2031674/app4/write"
    debug_topic: "/micro_lqr/debug"
    control_mode: "cascade"
    control_period_s: 0.003
    dry_run: false
    torque_limit: 0.12
    hard_torque_limit: 0.45
    arm_max_tilt_deg: 10.0
    arm_max_pitch_rate_rad_s: 0.30
    fall_cutoff_deg: 25.0
    imu_timeout_s: 0.05
    motor_timeout_s: 0.05
    rc_timeout_s: 0.20
    calibrate_switch_value: 1
    arm_switch_value: 3
    disable_switch_value: 2
    enable_velocity_command: false
    max_target_velocity: 0.20
    enable_yaw_rate_command: false
    max_target_yaw_rate_rad_s: 0.80
    rc_deadband: 0.08
    rc.forward_sign: 1.0
    rc.yaw_sign: -1.0
    rc.velocity_slew_rate_mps2: 0.60
    rc.yaw_rate_slew_rate_rad_s2: 3.0
    output_gain_sign: -1.0
    left_motor_sign: -1.0
    right_motor_sign: 1.0
    left_encoder_sign: 1.0
    right_encoder_sign: -1.0
    imu_angle_sign: 1.0
    imu_rate_sign: 1.0
    pitch_position_compensation_sign: 1.0
    pitch_rate_compensation_sign: 1.0
    yaw.enable: false
    yaw.imu_rate_sign: 1.0
    yaw.output_sign: 1.0
    yaw.rate_kp_per_wheel_nm_per_rad_s: 0.033
    yaw.rate_kd_per_wheel_nm_per_rad_s2: 0.0
    yaw.rate_deadband_rad_s: 0.02
    yaw.rate_filter_hz: 15.0
    yaw.acceleration_filter_hz: 8.0
    yaw.differential_torque_limit_nm: 0.025
    yaw.differential_slew_rate_nm_s: 0.50
    model.wheel_radius_m: 0.030
    lqr.use_manual_gain: true
    lqr.manual_k_pitch: -2.0
    lqr.manual_k_pitch_rate: -0.10
    lqr.manual_k_position: -0.55
    lqr.manual_k_velocity: -0.13
    lqr_gain_scale: 0.4
    cascade.attitude_k_pitch: 0.65
    cascade.attitude_k_pitch_rate: 0.058
    cascade.position_kp_rad_per_m: 0.12
    cascade.velocity_kd_rad_per_mps: 0.10
    cascade.position_ki_rad_per_m_s: 0.0
    cascade.enable_integral: false
    cascade.integral_limit_m_s: 0.20
    cascade.position_to_pitch_sign: -1.0
    cascade.pitch_limit_deg: 3.0
    cascade.pitch_slew_rate_deg_s: 20.0
    cascade.position_error_limit_m: 0.50
    cascade.velocity_error_limit_mps: 0.80
    cascade.outer_velocity_filter_hz: 8.0
    cascade.arm_bumpless: true
    cascade.pitch_trim_deg: 0.0
    cascade.auto_trim.enable: true
    cascade.auto_trim.gain_rad_per_m_s: 0.020
    cascade.auto_trim.limit_deg: 4.0
    cascade.auto_trim.position_deadband_m: 0.005
    cascade.auto_trim.velocity_limit_mps: 0.025
    cascade.auto_trim.pitch_rate_limit_rad_s: 0.10
    cascade.auto_trim.safe_pitch_deg: 6.0
    cascade.auto_trim.max_position_error_m: 0.15
    cascade.auto_trim.dwell_s: 0.50
    cascade.auto_trim.max_rate_deg_s: 0.10
    cascade.auto_trim.reset_on_calibrate: true
    motor_position_wrap_half_range: 3.141592653589793
    pitch_filter_hz: 40.0
    pitch_rate_filter_hz: 25.0
    wheel_velocity_filter_hz: 30.0
    position_velocity_filter_hz: 12.0
    velocity_blend: 0.6
    velocity_mismatch_warn_mps: 0.50
    auto_calibrate_on_first_valid_data: false
    stiction.enable: false
    stiction.velocity_limit_mps: 0.015
    stiction.pitch_rate_limit_rad_s: 0.08
    stiction.position_error_m: 0.008
    stiction.command_min_total_nm: 0.002
    stiction.compensation_each_nm: 0.005
