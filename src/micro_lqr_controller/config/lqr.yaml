micro_lqr_controller:
  ros__parameters:
    # ---------------- ROS / EtherCAT topics ----------------
    imu_topic: "/ecat/sn2031674/app1/read"
    rc_topic: "/ecat/sn2031674/app2/read"
    left_motor_read_topic: "/ecat/sn2031674/app3/read"
    left_motor_write_topic: "/ecat/sn2031674/app3/write"
    right_motor_read_topic: "/ecat/sn2031674/app4/read"
    right_motor_write_topic: "/ecat/sn2031674/app4/write"
    debug_topic: "/micro_lqr/debug"

    # Existing pitch/translation controller is unchanged.
    control_mode: "cascade"
    control_period_s: 0.003

    # New yaw differential direction is hardware-dependent.
    # Keep true for the first yaw sign/noise test, then change to false.
    dry_run: false
    torque_limit: 0.12
    hard_torque_limit: 0.45
    lqr_gain_scale: 0.4

    arm_max_tilt_deg: 10.0
    arm_max_pitch_rate_rad_s: 0.30
    fall_cutoff_deg: 25.0
    imu_timeout_s: 0.05
    motor_timeout_s: 0.05
    rc_timeout_s: 0.20

    calibrate_switch_value: 1
    arm_switch_value: 3
    disable_switch_value: 2

    # ---------------- DJI RC drive mapping ----------------
    # EcatV2 ReadDJIRC fields are normalized to [-1, 1].
    # right_y commands forward/backward target velocity.
    # left_x commands target yaw rate. No yaw angle is remembered.
    enable_velocity_command: true
    max_target_velocity: 0.20               # m/s at full right_y
    enable_yaw_rate_command: true
    max_target_yaw_rate_rad_s: 0.80          # rad/s at full left_x (~45.8 deg/s)
    rc_deadband: 0.08

    # Flip these only if a stick direction is opposite to the desired motion.
    rc.forward_sign: 1.0
    rc.yaw_sign: 1.0

    # Command ramps protect the balance loop from step inputs.
    rc.velocity_slew_rate_mps2: 0.60
    rc.yaw_rate_slew_rate_rad_s2: 3.0

    # ---------------- Hardware signs ----------------
    output_gain_sign: -1.0
    left_motor_sign: -1.0
    right_motor_sign: 1.0
    left_encoder_sign: 1.0
    right_encoder_sign: -1.0
    imu_angle_sign: 1.0
    imu_rate_sign: 1.0
    pitch_position_compensation_sign: 1.0
    pitch_rate_compensation_sign: 1.0

    # ---------------- Yaw-rate damping ----------------
    # This loop NEVER stores or controls yaw angle.
    # With centered left_x, yaw_rate_setpoint is zero and it damps disturbances.
    # With left_x command, it tracks the requested yaw rate:
    #   error = target_yaw_rate - filtered angular_velocity.z
    #   yaw differential = output_sign * (Kp*error - Kd*yaw_acceleration)
    # Positive differential adds physical forward torque to the left wheel and
    # subtracts the same amount from the right wheel.
    yaw.enable: true

    # HIPNUC/EcatV2 publishes angular_velocity.z in rad/s without axis remapping.
    # Flip only if your IMU installation makes the measured sign inconvenient.
    yaw.imu_rate_sign: 1.0

    # Hardware-direction switch. If a yaw disturbance is amplified instead of
    # resisted, change only +1.0 <-> -1.0.
    yaw.output_sign: 1.0

    # Per-wheel differential torque coefficients.
    # Start conservatively. Kd is optional and disabled by default.
    yaw.rate_kp_per_wheel_nm_per_rad_s: 0.033
    yaw.rate_kd_per_wheel_nm_per_rad_s2: 0.0

    # Continuous deadband: output is exactly zero inside this yaw-rate band.
    # Therefore, once yaw rotation stops, yaw torque stops; the new yaw angle is ignored.
    yaw.rate_deadband_rad_s: 0.02
    yaw.rate_filter_hz: 15.0
    yaw.acceleration_filter_hz: 8.0

    # Maximum differential added to one wheel and subtracted from the other.
    # Balance torque has priority; yaw is automatically reduced when common
    # per-wheel torque approaches torque_limit.
    yaw.differential_torque_limit_nm: 0.025
    yaw.differential_slew_rate_nm_s: 0.50

    # ---------------- Nominal model ----------------
    model.body_mass_kg: 1.0
    model.non_pitch_mass_kg: 0.09
    model.wheel_inertia_each_kg_m2: 2.8551e-5
    model.com_height_m: 0.095
    model.body_pitch_inertia_kg_m2: 0.0057245
    model.wheel_radius_m: 0.030
    model.gravity_mps2: 9.80665
    model.use_course_legacy_b4: false

    # ---------------- Old direct LQR fallback ----------------
    lqr.q_pitch: 1.0
    lqr.q_pitch_rate: 0.001
    lqr.q_position: 0.7
    lqr.q_velocity: 0.35
    lqr.r_total_torque: 20.0
    lqr.dare_max_iterations: 20000
    lqr.dare_tolerance: 1.0e-12
    lqr.use_manual_gain: true
    lqr.manual_k_pitch: -2.0
    lqr.manual_k_pitch_rate: -0.10
    lqr.manual_k_position: -0.55
    lqr.manual_k_velocity: -0.13

    # ---------------- Existing cascade controller ----------------
    # Values below preserve the current repository effect.
    cascade.attitude_k_pitch: 0.65
    cascade.attitude_k_pitch_rate: 0.048
    cascade.position_kp_rad_per_m: 0.235
    cascade.velocity_kd_rad_per_mps: 0.17
    cascade.position_ki_rad_per_m_s: 0.0
    cascade.enable_integral: false
    cascade.integral_limit_m_s: 0.20
    cascade.position_to_pitch_sign: -1.0
    cascade.pitch_limit_deg: 5.0
    cascade.pitch_slew_rate_deg_s: 100.0
    cascade.position_error_limit_m: 0.50
    cascade.velocity_error_limit_mps: 0.80
    cascade.outer_velocity_filter_hz: 5.0

    # ---------------- State estimation filters ----------------
    motor_position_wrap_half_range: 3.141592653589793
    pitch_filter_hz: 40.0
    pitch_rate_filter_hz: 25.0
    wheel_velocity_filter_hz: 30.0
    velocity_blend: 1.0
    velocity_mismatch_warn_mps: 0.50
    auto_calibrate_on_first_valid_data: false
